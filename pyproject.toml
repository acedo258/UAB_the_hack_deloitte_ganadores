[project]
name = "soc-n1-tarvia"
version = "0.1.0"
description = "Sistema de triaje SOC de Nivel 1 para Tarvia Group"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.50",
    "pydantic>=2.7",
    "sse-starlette>=2.0",
    "pytest>=8",
    "httpx>=0.27",
    "pytz",
    "requests>=2.31",
]

[tool.pytest.ini_options]
pythonpath = ["."]
